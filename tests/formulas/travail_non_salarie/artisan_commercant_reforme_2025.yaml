# Cotisations maladie-maternité et retraite complémentaire des artisans et commerçants
# depuis la réforme de 2025 (décret n° 2024-688 ; articles D621-1, D621-2 et D635-7 du code de la sécurité sociale).
# L'assiette retenue est rpns_imposables (l'assiette unique de l'article L131-6 n'est pas encore modélisée).

- name: Commercant 2025, revenu de 100000 €
  period: 2025
  absolute_error_margin: 1
  input:
    rpns_imposables: 100000
    categorie_non_salarie: commercant
  output:
    maladie_maternite_artisan_commercant: -7798.51
    retraite_complementaire_artisan_commercant: -8629.0

