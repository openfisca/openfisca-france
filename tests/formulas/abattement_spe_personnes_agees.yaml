# Abattement spécial personnes âgées ou invalides (CGI, art. 157 bis) :
# l'abattement est doublé lorsque les deux membres du couple soumis à
# imposition commune remplissent les conditions d'âge (65 ans ou plus au
# 31 décembre) ou d'invalidité. Échelle 2023 (contribuable_age_invalide) :
# 2 746 € si le revenu net global n'excède pas 17 200 €, 1 373 € s'il est
# compris entre 17 200 € et 27 670 €, aucun au-delà.
# Attendus vérifiés contre le programme officiel de référence DGFiP
# (millésime 2023, sources2023m_8_0) et la doctrine (BOI-IR-BASE-40-20240618,
# § 60 ; brochure « Calcul de l'impôt 2024 »).

- name: "abat_spe - Couple marié dont les deux membres ont 65 ans ou plus, revenu net global entre 17 200 € et 27 670 € (cas d'un foyer de retraités à 14 936 € chacun : l'abattement est doublé, 2 × 1 373 €)"
  period: 2023
  absolute_error_margin: 0.5
  input:
    foyer_fiscal:
      declarants: [1, 2]
    individus:
      1:
        date_naissance: '1950-12-24'
        retraite_imposable: 14936
        statut_marital: marie
      2:
        date_naissance: '1948-05-11'
        retraite_imposable: 14936
        statut_marital: marie
    familles:
      famille_0:
        parents: [1, 2]
    menages:
      menage_0:
        personne_de_reference: [1]
        conjoint: [2]
  output:
    abat_spe: 2746
    rni: 24138
    impot_revenu_restant_a_payer: 0

