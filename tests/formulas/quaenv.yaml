- name: CITE 2016-2019 — le plafond s'impute en commençant par le taux le plus élevé
  description: >-
    Pour une personne seule le plafond de dépenses est de 8 000 €. Avec 6 000 € de
    dépose de cuve à fioul (50 %) et 6 000 € au taux général (30 %), le plafond est
    saturé par le taux le plus élevé d'abord : 6 000 × 50 % + 2 000 × 30 % = 3 600 €.
    L'ordre inverse donnerait 6 000 × 30 % + 2 000 × 50 % = 2 800 €.
  period: 2019
  absolute_error_margin: 0.1
  input:
    foyer_fiscal:
      declarants: [ind0]
      f7bq_2020: 6000
      f7ar_2019: 6000
    individus:
      ind0:
        date_naissance: '1970-01-01'
    famille:
      parents: [ind0]
    menage:
      personne_de_reference: ind0
  output:
    quaenv: 3600
