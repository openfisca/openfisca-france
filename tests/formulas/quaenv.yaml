- name: CITE 2016 — le report 7AA est pris au taux de l'année d'engagement
  description: >-
    La case 7AA de la déclaration 2017 porte les dépenses de chaudière à condensation
    engagées en 2015, dernière année où ce geste ouvrait droit au crédit. Le taux
    retenu est donc celui de 2015 (30 %), et non celui de l'année de déclaration —
    où le geste n'est plus subventionné et où lire le barème de 2016 donnerait 0.
  period: 2016
  absolute_error_margin: 0.1
  input:
    foyer_fiscal:
      declarants: [ind0]
      f7aa_2016: 1000
    individus:
      ind0:
        date_naissance: '1970-01-01'
    famille:
      parents: [ind0]
    menage:
      personne_de_reference: ind0
  output:
    quaenv: 300

