- name: CITE 2018 — les parois vitrées sont au taux réduit de 15 %
  description: >-
    L'article 79 de la LF 2018 ramène le taux à 15 % pour les matériaux d'isolation
    thermique des parois vitrées (case 7AM), le taux général restant à 30 % (case 7AK
    en témoin).
  period: 2018
  absolute_error_margin: 0.1
  input:
    foyer_fiscal:
      declarants: [ind0]
      f7am_2018: 1000
    individus:
      ind0:
        date_naissance: '1970-01-01'
    famille:
      parents: [ind0]
    menage:
      personne_de_reference: ind0
  output:
    quaenv: 150

