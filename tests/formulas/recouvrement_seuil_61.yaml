# Recouvrement à la frontière du seuil de 61 € et arrondis de la décote démontrés
# (CGI, art. 1657, 1 bis ; BOI-IR-LIQ-20-20-40-20180704, § 60 et § 50) :
# - la cotisation initiale n'est pas mise en recouvrement que si son montant global,
#   avant imputation de tout crédit d'impôt, est strictement inférieur à 61 € ;
# - la décote est calculée sur le barème plafonné arrondi à l'euro le plus proche
#   (le demi-euro compté pour un), et son propre demi-euro est départagé vers le haut.
#
# Valeurs produites par exécutions réelles conservées (dossier de préparation,
# preuves/collecte-patch/summary.json : candidat composé « seuil + décote sur barème
# arrondi + demi-euro vers le haut », millésimes 2019-2023, situations figées des
# panneaux d'étude, comparées étape par étape au moteur de référence DGFiP) :
# impot_revenu_restant_a_payer = -(cotisation due) ; décote identique à la référence.
#
# Sans le patch, les cas 17 043 € (2020), 31 797 € (2020), 17 040 € (2019),
# 51 888 € (2021) et 57 321 € (2023) échouent : ils matérialisent les corrections.
- name: impot_revenu_restant_a_payer - 2020 - Célibataire avec un salaire imposable (1AJ) de 17 043 €, impôt exactement égal au seuil de recouvrement de 61 €
  period: 2020
  absolute_error_margin: 0.5
  input:
    famille:
      parents: [vous]
    foyer_fiscal:
      declarants: [vous]
    menage:
      personne_de_reference: [vous]
    individus:
      vous:
        salaire_imposable: 17043
        statut_marital: celibataire
        date_naissance: 1980-01-01
  output:
    impot_revenu_restant_a_payer: -61
