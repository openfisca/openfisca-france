  notes:
    2025-01-01:
     - title: les valeurs 2025 sont des projections à partir des données 2024, dernière année connue début septembre 2026. Les valeurs 2024 ont été augmentées de 2.0 % qui est l'évolution moyenne du SMPT économique (retraité du chômage partiel pendant la crise sanitaire) pour l'année 2025 prévue dans la note de conjoncture de l'INSEE de juin 2026
    2026-01-01:
     - title: les valeurs 2026 sont des projections à partir des données 2024, dernière année connue début septembre 2026. Les valeurs 2024 ont été augmentées de 4.2 % qui est l'évolution moyenne du SMPT économique cumulées pour les années 2025 (2.0%), 2026 (2.2%) telles que prévues dans la note de conjoncture de l'INSEE de juin 2026.
    2027-01-01:
     - title: les valeurs 2026 sont des projections à partir des données 2024, dernière année connue début septembre 2026. Les valeurs 2024 ont été augmentées de 4.2 % qui est l'évolution moyenne du SMPT économique cumulées pour les années 2025 (2.0%), 2026 (2.2%), 2027 (2.2%) telles que prévues dans la note de conjoncture de l'INSEE de juin 2026. Le montant 2027 est une copie du taux pour 2026

documentation: Attention les valeurs de l'INSEE sont renseignées en euros constant de la dernière année reportée. Les valeurs des année précédentes sont donc mises à jour chaque année
