description: Montant horaire brut du SMIC à retenir pour le calcul de la réduction générale des cotisations patronales en 2026
values:
  2026-01-01:
    value: 12.02
metadata:
  short_label: SMIC horaire de référence pour l'allègement général
  last_value_still_valid_on: "2026-10-01"
  unit: currency
  reference:
    2026-01-01:
    - title: Article D241-7 du Code de la Sécurité sociale
      href: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000054252241
    - title: Décret n° 2026-509 du 12 juin 2026
      href: https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000054248488
    - title: Décret n° 2025-1228 du 17/12/2025 portant relèvement du salaire minimum de croissance
      href: https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000053014883
  official_journal_date:
    2026-01-01: "2025-12-18"
  documentation: |-
    Pour le calcul de la réduction générale au titre de 2026, le décret n° 2026-509
    impose de retenir le montant du SMIC applicable au 1er janvier 2026, y compris
    pour les périodes postérieures à une revalorisation du SMIC en cours d'année.
    Ce paramètre est donc distinct du SMIC en vigueur à la date de calcul.
