    - title: Depuis le 1er janvier 2013, le taux de cotisations est unifié pour les différentes catégories d'independants.
    2025-01-01:
    - title: Depuis le 1er janvier 2025, la borne inférieure de cette tranche est le plafond annuel de la sécurité sociale et non plus le plafond RCI.
documentation: |-
  Le nom du paramètre renvoie à la borne en vigueur jusqu'au 31/12/2024.
  Jusqu'en 2024, ce taux s'applique à la part de l'assiette comprise entre le plafond RCI (montant_du_plafond_rci) et quatre plafonds annuels de la sécurité sociale (PSS).
  Depuis le 1er janvier 2025, il s'applique à la part comprise entre un et quatre PSS (article D635-7 du code de la sécurité sociale, décret n° 2024-688 du 5 juillet 2024).
