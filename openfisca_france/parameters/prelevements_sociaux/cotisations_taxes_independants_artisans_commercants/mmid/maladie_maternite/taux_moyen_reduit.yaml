metadata:
  short_label: Taux moyen réduit
  label_en: Reduced average rate
  threshold_unit: PSS
  rate_unit: /1
  reference:
    2018-01-01:
    - title: Article D621-2 du Code de la sécurité sociale (T1 = 7,2 %, T2 = 2,2 %, T3 = 0,85 %)
      href: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000036469691/2018-01-01
    - title: Décret n° 2017-1894 du 30 décembre 2017, art. 8 (périodes courant à compter du 1er janvier 2018)
      href: https://www.legifrance.gouv.fr/loda/article_lc/LEGIARTI000036456548/2018-01-01
    2022-01-01:
    - title: Article D621-2 du Code de la sécurité sociale (T1 = 0,5 %, T2 = 4,5 %, T3 = 7,2 %)
      href: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000046714747/2022-12-10
    - title: Décret n° 2022-1529 du 7 décembre 2022, art. 4, II (périodes courant à compter du 1er janvier 2022)
      href: https://www.legifrance.gouv.fr/loda/article_lc/LEGIARTI000046712238/2022-12-10
    2025-01-01:
    - title: Article D621-2 du Code de la sécurité sociale (T1 = 1,5 %, T2 = 4 %, T3 = 6,5 %, T4 = 7,7 %, T5 = 8,5 %)
      href: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000049904592/2024-07-07
  official_journal_date:
    2018-01-01: "2017-12-31"
    2022-01-01: "2022-12-09"
    2025-01-01: "2024-07-06"
  notes:
    2018-01-01:
    - title: "Sous 40 % du PSS, taux = (T1 - T2) × r / (1,1 × PSS) + (T2 - T3) × r / (0,4 × PSS) + T3 ; de 40 % à 110 % du PSS, taux = (T1 - T2) × r / (1,1 × PSS) + T2. Le taux moyen croît donc linéairement de 0,85 % à 4,0182 % (T2 + 0,4 × (T1 - T2) / 1,1, arrondi au dix-millionième) puis jusqu'à 7,2 %."
    2022-01-01:
    - title: Taux de 0,5 % sous 40 % du PSS, puis interpolation linéaire jusqu'à 4,5 % à 60 % du PSS et 7,2 % à 110 % du PSS.
    2025-01-01:
    - title: Taux nul sous 20 % du PSS ; interpolation linéaire du taux moyen entre deux seuils successifs.
documentation: |-
  Le dernier seuil du barème marque la fin de la réduction : 110 % du PSS jusqu'en 2024, trois PSS depuis 2025.
  Jusqu'en 2024, ces taux incluent la part finançant les indemnités journalières (0,85 % puis 0,5 % depuis 2022),
  que l'Urssaf présente séparément (« maladie 2 »).
