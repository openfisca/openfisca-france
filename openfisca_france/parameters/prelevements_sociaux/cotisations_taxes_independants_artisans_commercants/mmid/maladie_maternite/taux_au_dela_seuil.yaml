description: Taux de la cotisation maladie-maternité des travailleurs indépendants au-delà du seuil du taux de base
values:
  2018-01-01:
    value: 0.065
metadata:
  short_label: Taux au-delà du seuil
  label_en: Rate above the threshold
  unit: /1
  reference:
    2018-01-01:
    - title: Article D621-1 du Code de la sécurité sociale
      href: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000036469673/2018-01-01
      note: "6,5 % lorsque le revenu d'activité est supérieur à cinq fois la valeur annuelle du plafond"
    2020-01-01:
    - title: Article D621-1 du Code de la sécurité sociale
      href: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000041966835/2020-05-25
      note: "6,5 % pour la fraction des revenus qui dépasse cinq fois la valeur annuelle du plafond"
    2025-01-01:
    - title: Article D621-1 du Code de la sécurité sociale
      href: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000049904610/2024-07-07
      note: "6,5 % pour la part au-delà de ce montant"
  official_journal_date:
    2018-01-01: "2017-12-31"
    2020-01-01: "2020-05-24"
    2025-01-01: "2024-07-06"
documentation: |-
  En 2018 et 2019, le taux de 6,5 % s'applique à l'ensemble du revenu lorsque celui-ci dépasse le seuil ; depuis 2020,
  il s'applique à la seule fraction qui le dépasse. La date du 1er janvier 2020 reprend celle de la formule existante ;
  la rédaction « fraction » est issue du décret n° 2020-621 du 22 mai 2020, en vigueur le 25 mai 2020.
