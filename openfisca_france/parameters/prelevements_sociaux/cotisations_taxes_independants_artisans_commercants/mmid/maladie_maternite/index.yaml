documentation: |-
  Sous le dernier seuil du barème taux_moyen_reduit (110 % du PSS jusqu'en 2024, trois PSS depuis 2025), le taux de base
  fait l'objet d'une réduction : le taux moyen appliqué à toute l'assiette varie linéairement entre les seuils (art. D621-2).
  Au-delà, le taux de base s'applique jusqu'à seuil_taux_base (cinq PSS jusqu'en 2024, trois PSS depuis 2025), puis
  taux_au_dela_seuil (6,5 %) s'applique (art. D621-1). L'assiette minimale de 40 % du PSS prévue jusqu'en 2024 n'est pas modélisée.
